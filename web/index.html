<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="belumi_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Belumi Beauty</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top left, #ffe8e0 0, #ffffff 58%);
      font-family: Inter, Arial, sans-serif;
    }

    #belumi-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #193447;
      transition: opacity 220ms ease;
    }

    #belumi-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .belumi-loader-card {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .belumi-loader-mark {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      border: 1px solid rgba(25, 52, 71, 0.14);
      box-shadow: 0 18px 44px rgba(25, 52, 71, 0.12);
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.8);
      font-size: 34px;
      font-weight: 700;
      font-family: Georgia, serif;
    }

    .belumi-loader-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="belumi-loader" aria-label="Loading Belumi">
    <div class="belumi-loader-card">
      <div class="belumi-loader-mark">B</div>
      <div class="belumi-loader-text">Belumi Beauty</div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('belumi-loader');
      if (!loader) return;
      loader.classList.add('hidden');
      setTimeout(function () {
        loader.remove();
      }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
